    <div class="end-acts">
      <button class="btn btn-solid" type="button" data-act="again">Play again</button>
      <button class="btn btn-ghost" type="button" data-act="next">See what's next</button>

  </div>

    </div>
    <div class="speeds" id="speeds" role="group" aria-label="Playback speed"></div>
